<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the layout use the whole phone screen; the CSS keeps content
       clear of the notch and home bar with env(safe-area-inset-*). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Switchboard</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <header class="bar">
        <h1>Switchboard</h1>
        <span id="conn" class="conn" title="Live updates: connecting"></span>
        <button id="new-btn" class="icon-btn" type="button" aria-label="Start a session" title="Start a session">+</button>
      </header>
      <nav id="session-list" class="sessions" aria-label="Sessions"></nav>
      <footer class="side-foot">
        <label class="check"><input type="checkbox" id="show-stopped"> Show stopped</label>
        <button id="logout" class="link" type="button">Sign out</button>
      </footer>
    </aside>

    <main class="chat">
      <div id="placeholder" class="placeholder">
        <p>Pick a session, or start one with <strong>+</strong>.</p>
      </div>

      <header id="chat-bar" class="bar chat-bar" hidden>
        <a href="#" class="icon-btn back" aria-label="Back to sessions">‹</a>
        <div class="title">
          <span id="chat-dot" class="dot"></span>
          <div>
            <div id="chat-title" class="chat-title"></div>
            <div id="chat-sub" class="chat-sub"></div>
          </div>
        </div>
        <button id="term-btn" class="ghost" type="button" aria-pressed="false">Terminal</button>
        <button id="stop-btn" class="ghost danger" type="button">Stop</button>
      </header>

      <section id="terminal" class="terminal" hidden aria-label="Terminal screen">
        <div class="term-head">
          <span>What the terminal shows now</span>
          <button id="term-refresh" class="link" type="button">Refresh</button>
        </div>
        <pre id="term-screen"></pre>
      </section>

      <div id="messages" class="messages" aria-live="polite"></div>

      <form id="composer" class="composer" hidden>
        <textarea id="input" rows="1" placeholder="Message" autocomplete="off" enterkeyhint="send" aria-label="Message"></textarea>
        <button type="submit" id="send">Send</button>
      </form>
    </main>
  </div>

  <dialog id="start-dialog">
    <form id="start-form" method="dialog">
      <h2>Start a session</h2>
      <label>Id
        <input name="id" required pattern="[a-z0-9][a-z0-9\-]{0,31}" placeholder="api-fix" autocapitalize="off" autocomplete="off" spellcheck="false">
        <small>Lowercase letters, digits and hyphens.</small>
      </label>
      <label>Project folder
        <input name="projectDir" required placeholder="/home/you/project or C:\Users\you\project" autocapitalize="off" autocomplete="off" spellcheck="false">
      </label>
      <label>Permission mode
        <select name="permissionMode">
          <option value="acceptEdits" selected>acceptEdits: edits files, asks before commands</option>
          <option value="plan">plan: plans only, changes nothing</option>
          <option value="manual">manual: asks before everything</option>
          <option value="auto">auto: a classifier decides</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" name="manager"> Manager (can start and control other sessions)</label>
      <p id="start-status" class="form-status" role="status"></p>
      <div class="actions">
        <button type="button" class="ghost" id="start-cancel">Cancel</button>
        <button type="submit" id="start-submit">Start</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="alert" hidden></div>
</body>
</html>
