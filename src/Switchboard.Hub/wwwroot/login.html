<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>Sign in · Switchboard</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/login.js"></script>
</head>
<body class="login-page">
  <form id="login" class="login-card">
    <img src="/icon.svg" alt="" width="48" height="48">
    <h1>Switchboard</h1>
    <label>Password
      <input id="password" type="password" autocomplete="current-password" required autofocus>
    </label>
    <label class="check"><input id="remember" type="checkbox" checked> Remember me for 30 days</label>
    <p id="error" class="form-status error" role="alert"></p>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
